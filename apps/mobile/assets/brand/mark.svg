<!--
  さいえん手帳のシンボル「畝と芽」（案 C / 2026-08-04 決定）

  これがブランドマークの正。アイコン・スプラッシュ・favicon はすべてこの SVG から
  scripts/assets/generate-brand-assets.mjs で書き出す。PNG を直接編集しないこと。

  形の決めごと:
  - 畝（明るい緑）は最後に描く。茎の根元を覆うことで「植わっている」ように見せる。
    芽を宙に浮かせると、畑ではなく観葉植物に見える。
  - 双葉は左右で大きさを変える。左右対称にすると図形記号に寄りすぎる。
  - 線は太い（茎 9 / 畝 10）。24px まで縮めても潰れないことを実測で確認している。
    畝を折って芽が抜ける案も描いたが、その大きさでは断片が寄り集まって
    「K」のような抽象記号に見えたため不採用。

  色は apps/mobile/src/constants/theme.ts の若葉パレット:
    #5B9B3E accent    … 畝
    #2F4A25 accentInk … 芽（茎と双葉）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <g fill="#2F4A25">
    <path d="M48 38 C57 25 72 22 79 27 C73 41 57 46 48 38 Z" />
    <path d="M48 50 C41 40 30 38 24 42 C29 52 41 56 48 50 Z" />
  </g>
  <!--
    茎の下端は 60。丸い先端が半径 4.5 伸びて 64.5 になる。畝は中央で 56〜66 を
    覆うので隠れる。ここを 62 にすると先端が畝の下に 0.5 だけ覗き、
    1024px の書き出しで黒い点として見えた。
  -->
  <path d="M48 60 V28" fill="none" stroke="#2F4A25" stroke-width="9" stroke-linecap="round" />
  <path d="M14 70 Q48 52 82 70" fill="none" stroke="#5B9B3E" stroke-width="10" stroke-linecap="round" />
</svg>
